version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Boise
    groups:
      go-patch-and-minor:
        update-types:
          - patch
          - minor
    labels:
      - dependencies
      - area/ci

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Boise
    groups:
      actions-patch-and-minor:
        update-types:
          - patch
          - minor
    labels:
      - dependencies
      - area/ci
