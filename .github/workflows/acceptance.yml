name: Live Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 2"

permissions:
  contents: read

concurrency:
  group: live-acceptance
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: acceptance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Run controller-backed acceptance tests
        env:
          TF_ACC: "1"
          UNIFI_API_URL: ${{ secrets.UNIFI_API_URL }}
          UNIFI_API_KEY: ${{ secrets.UNIFI_API_KEY }}
          UNIFI_ALLOW_INSECURE: ${{ vars.UNIFI_ALLOW_INSECURE }}
          UNIFI_TEST_SITE_ID: ${{ vars.UNIFI_TEST_SITE_ID }}
          UNIFI_TEST_SITE_NAME: ${{ vars.UNIFI_TEST_SITE_NAME }}
          UNIFI_TEST_NAME_PREFIX: gha-acctest-
          UNIFI_TEST_WIFI_PASSPHRASE: ${{ secrets.UNIFI_TEST_WIFI_PASSPHRASE }}
          UNIFI_TEST_ENABLE_ZONE_FIREWALL: ${{ vars.UNIFI_TEST_ENABLE_ZONE_FIREWALL }}
          UNIFI_TEST_PORT_FORWARD_IP: ${{ vars.UNIFI_TEST_PORT_FORWARD_IP }}
        run: TF_ACC_TERRAFORM_PATH="$(command -v terraform)" make testacc
