name: Release
run-name: Release ${{ inputs.version }}${{ inputs.candidate && format(' from {0}', inputs.candidate) || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v (e.g. 0.6.0-rc.1 or 0.6.0)
        required: true
        type: string
      candidate:
        description: Published RC tag to promote (stable only, e.g. v0.6.0-rc.1)
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize publication, including validation, without interrupting a release.
concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      notes_base64: ${{ steps.metadata.outputs.notes_base64 }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate release and resolve source
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_TAG: ${{ inputs.candidate }}
        run: python3 scripts/prepare_release.py

  go:
    needs: prepare
    uses: ./.github/workflows/go.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  docs:
    needs: prepare
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  terraform:
    needs: prepare
    uses: ./.github/workflows/terraform.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  publish:
    needs: [prepare, go, docs, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Install archive tooling
        run: sudo apt-get update && sudo apt-get install -y gnupg zip
      - name: Build release artifacts
        run: make release-artifacts VERSION="${RELEASE_VERSION}"
      - name: Smoke test packaged provider
        run: bash scripts/smoke-test-release.sh "${RELEASE_VERSION}"
      - name: Sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: make sign-release-artifacts VERSION="${RELEASE_VERSION}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_BASE64: ${{ needs.prepare.outputs.notes_base64 }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "${NOTES_BASE64}" | base64 --decode > "${notes_file}"
          mapfile -t release_files < <(find dist/release -maxdepth 1 -type f | sort)
          flags=(--latest=false)
          if [[ "${PRERELEASE}" == true ]]; then
            flags+=(--prerelease)
          fi
          # Upload all signed assets before publishing the release event.
          gh release create "v${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "v${RELEASE_VERSION}" \
            --draft "${flags[@]}" \
            --notes-file "${notes_file}" \
            "${release_files[@]}"
          latest=true
          if [[ "${PRERELEASE}" == true ]]; then
            latest=false
          fi
          gh release edit "v${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${latest}"
