name: Release
run-name: Release ${{ inputs.version }}${{ inputs.candidate && format(' from {0}', inputs.candidate) || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v (e.g. 0.6.0-rc.1 or 0.6.0)
        required: true
        type: string
      candidate:
        description: Published RC tag to promote (stable only, e.g. v0.6.0-rc.1)
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize publication, including validation, without interrupting a release.
concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      notes_base64: ${{ steps.metadata.outputs.notes_base64 }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release and resolve source
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_TAG: ${{ inputs.candidate }}
        run: python3 scripts/prepare_release.py

  go:
    needs: prepare
    uses: ./.github/workflows/go.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  docs:
    needs: prepare
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  terraform:
    needs: prepare
    uses: ./.github/workflows/terraform.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  build:
    needs: [prepare, go, docs, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Install archive tooling
        run: sudo apt-get update && sudo apt-get install -y gnupg zip
      - name: Build release artifacts
        run: make release-artifacts VERSION="${RELEASE_VERSION}"
      - name: Smoke test packaged provider
        run: bash scripts/smoke-test-release.sh "${RELEASE_VERSION}"
      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-${{ needs.prepare.outputs.version }}
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-release-${{ needs.prepare.outputs.version }}
          path: dist/release
      - name: Install signing tooling
        run: sudo apt-get update && sudo apt-get install -y gnupg
      - name: Sign release checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          set -euo pipefail
          checksum_file="dist/release/terraform-provider-unifi_${RELEASE_VERSION}_SHA256SUMS"
          signature_file="${checksum_file}.sig"
          test -f "${checksum_file}"

          gnupg_home="$(mktemp -d)"
          trap 'rm -rf "${gnupg_home}"' EXIT
          chmod 700 "${gnupg_home}"
          export GNUPGHOME="${gnupg_home}"

          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "${fingerprint}"
          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "${PASSPHRASE}" \
            --local-user "${fingerprint}" \
            --detach-sign \
            --output "${signature_file}" \
            "${checksum_file}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_BASE64: ${{ needs.prepare.outputs.notes_base64 }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s' "${NOTES_BASE64}" | base64 --decode > "${notes_file}"
          mapfile -t release_files < <(find dist/release -maxdepth 1 -type f | sort)
          flags=(--latest=false)
          if [[ "${PRERELEASE}" == true ]]; then
            flags+=(--prerelease)
          fi
          # Upload all signed assets before publishing the release event.
          gh release create "v${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "v${RELEASE_VERSION}" \
            --draft "${flags[@]}" \
            --notes-file "${notes_file}" \
            "${release_files[@]}"
          latest=true
          if [[ "${PRERELEASE}" == true ]]; then
            latest=false
          fi
          gh release edit "v${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${latest}"
