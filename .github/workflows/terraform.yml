name: Terraform

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate for a release
        required: true
        type: string
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.61.0

      - name: Read release version from changelog
        id: changelog
        run: bash ./scripts/read-changelog-release.sh CHANGELOG.md >> "${GITHUB_OUTPUT}"

      - name: Build local provider mirror
        run: |
          version="${{ steps.changelog.outputs.version }}"
          mirror_dir="${RUNNER_TEMP}/tf-mirror/registry.terraform.io/badgerops/unifi/${version}/linux_amd64"
          mkdir -p "${mirror_dir}"
          go build -o "${mirror_dir}/terraform-provider-unifi_v${version}" .

      - name: Configure Terraform provider mirror
        run: |
          cat > "${RUNNER_TEMP}/terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "${RUNNER_TEMP}/tf-mirror"
              include = ["badgerops/unifi"]
            }
            direct {
              exclude = ["badgerops/unifi"]
            }
          }
          EOF

      - name: Check Terraform formatting
        run: make terraform-fmt-check

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: Run TFLint
        run: make tflint

      - name: Terraform init example
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: terraform -chdir=examples/basic-site init -backend=false

      - name: Terraform validate example
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: terraform -chdir=examples/basic-site validate
