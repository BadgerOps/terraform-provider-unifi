name: Terraform

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate for a release
        required: true
        type: string
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform-versions:
    name: validate (${{ matrix.terraform-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform-version:
          - 1.5.0
          - 1.5.7

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform-version }}
          terraform_wrapper: false

      - name: Set up TFLint
        if: matrix.terraform-version == '1.5.7'
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.61.0

      - name: Read release version from changelog
        id: changelog
        run: bash ./scripts/read-changelog-release.sh CHANGELOG.md >> "${GITHUB_OUTPUT}"

      - name: Build local provider mirror
        run: |
          version="${{ steps.changelog.outputs.version }}"
          mirror_dir="${RUNNER_TEMP}/tf-mirror/registry.terraform.io/badgerops/unifi/${version}/linux_amd64"
          mkdir -p "${mirror_dir}"
          go build -o "${mirror_dir}/terraform-provider-unifi_v${version}" .

      - name: Configure Terraform provider mirror
        run: |
          cat > "${RUNNER_TEMP}/terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "${RUNNER_TEMP}/tf-mirror"
              include = ["badgerops/unifi"]
            }
            direct {
              exclude = ["badgerops/unifi"]
            }
          }
          EOF

      - name: Check Terraform formatting
        run: make terraform-fmt-check

      - name: Initialize TFLint plugins
        if: matrix.terraform-version == '1.5.7'
        run: tflint --init

      - name: Run TFLint
        if: matrix.terraform-version == '1.5.7'
        run: make tflint

      - name: Terraform init example
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: terraform -chdir=examples/basic-site init -backend=false

      - name: Terraform validate example
        env:
          TF_CLI_CONFIG_FILE: ${{ runner.temp }}/terraformrc
        run: terraform -chdir=examples/basic-site validate

  # The master ruleset requires a check named `validate`; the matrix jobs
  # report as `validate (<version>)`, so this job reports their combined result.
  validate:
    if: always()
    needs: terraform-versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Terraform version to pass
        env:
          RESULT: ${{ needs.terraform-versions.result }}
        run: test "${RESULT}" = success
